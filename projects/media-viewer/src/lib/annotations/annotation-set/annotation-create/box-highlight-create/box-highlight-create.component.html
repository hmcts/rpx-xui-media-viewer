<div #drawingContainer class="drawing-container"
  [class.drawing-container--enabled]="drawMode"
  [tabindex]="drawMode && isCurrentPage ? 0 : -1"
  mvKeyboardBoxDraw
  [enabled]="drawMode && isCurrentPage"
  (cursorPositionChanged)="onCursorPositionChanged($event)"
  (drawingStarted)="onDrawingStarted($event)"
  (drawingUpdated)="onDrawingUpdated($event)"
  (drawingConfirmed)="onDrawingConfirmed($event)"
  (drawingCancelled)="onDrawingCancelled()"
  (mousedown)="initHighlight($event)"
  (mousemove)="updateHighlight($event)"
  (mouseup)="createHighlight()">
  <!-- TODO STYLE: Replace inline styles with CSS classes -->
  <div *ngIf="showCursor"
    class="drawing-cursor drawing-cursor--positioned"
    [style.top]="cursorY + 'px'"
    [style.left]="cursorX + 'px'">
  </div>
  <!-- TODO STYLE: Replace inline styles with CSS classes -->
  <div #boxHighlight
    class="box-highlight"
    [class.box-highlight--active]="display === 'block'"
    [style.height]="height ? height + 'px' : '100%'"
    [style.width]="width ? width + 'px' : '100%'"
    [style.top]="top + 'px'"
    [style.left]="left + 'px'">
  </div>
</div>
