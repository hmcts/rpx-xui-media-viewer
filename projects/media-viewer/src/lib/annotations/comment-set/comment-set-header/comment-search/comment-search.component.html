<input
  #searchInput
  type="text"
  class="govuk-input comment-search__item"
  id="search-comments-input"
  name="searchString"
  aria-label="search comments input"
  [ngModel]="searchString"
  (ngModelChange)="searchString = $event"
  />
<button
  type="button"
  [class.govuk-button--disabled]="searchInput?.value.length <= 2"
  class="govuk-button comment-search__item"
  (click)="searchComments(searchInput.value.trim())"
  >
  {{ "Search" | rpxTranslate }}
</button>
@if (searchResults.length > 0) {
  <mv-comments-navigate [annotationList]="searchResults"></mv-comments-navigate>
}
@if (searchString && searchResults?.length === 0) {
  <p class="comment-search__item">
    {{ "No matches have been found" | rpxTranslate }}
  </p>
}
