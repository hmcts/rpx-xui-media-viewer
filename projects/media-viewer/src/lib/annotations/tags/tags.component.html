<div class="tags">
  @if (editable) {
    <tag-input
      class="tags__edit"
      [maxItems]="10"
      [ngModel]="tagItems"
      (ngModelChange)="tagItems = $event; onUpdateTags($event)"
      [ngModelOptions]="{standalone:true}"
      [placeholder]="'Add tag'"
      [displayBy]="'label'"
      [identifyBy]="'name'"
      [onTextChangeDebounce]="250"
      [secondaryPlaceholder]="'Search or add tags'"
      [validators]="validators"
      [errorMessages]="errorMessages"
      [onlyFromAutocomplete]="false">
      <tag-input-dropdown
        [autocompleteObservable]="requestAutocompleteItems"
        [displayBy]="'label'"
        [identifyBy]="'name'"
        [zIndex]="10000"
        [minimumTextLength]="2">
        <ng-template let-item="item" let-index="index">
          {{ item.label }}
        </ng-template>
      </tag-input-dropdown>
    </tag-input>
  }

  @if (!editable && (tagItems && tagItems.length)) {
    <div class="tags__renderer">
      @for (tag of tagItems; track tag) {
        <span class="tags__item hmcts-badge">
          {{tag.label}}
        </span>
      }
    </div>
  }
</div>
