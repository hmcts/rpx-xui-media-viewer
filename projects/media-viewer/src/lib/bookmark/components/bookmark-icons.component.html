<div class="pageContainer">
  @for (bookmarks of (bookmarksPerPage$ | async); track bookmarks; let i = $index) {
    <div
      class="pageContainer__page"
       [ngStyle]="{
         'width.px': bookmarks.styles.width,
         'height.px': bookmarks.styles.height
       }">
      <div class="pageContainer__page-item">
        @for (bMrk of bookmarks.bookmark; track bMrk) {
          <div class="bookmark__here"
            [style.width]="16 * zoom + 'px'"
            [style.height]="24 * zoom + 'px'"
            [style.top]="bMrk.yCoordinate * zoom + 'px'"
            [title]="bMrk.name">
          </div>
        }
      </div>
    </div>
  }
</div>
