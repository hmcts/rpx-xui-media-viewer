<div class="govuk-width-container">
  <div class="govuk-notification-banner__content">
    <p>
      @if (typeException) {
        <span>The document could not be displayed, or the file type is unsupported.</span>
      } @else {
        <span>This file type is not supported by this viewer.</span>
      }
      Please <a #downloadLink [href]="url" [download]="downloadFileName">click here to download</a>.
    </p>
  </div>
</div>
